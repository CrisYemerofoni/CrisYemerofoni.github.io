<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>YemeroFoni · Realidad aumentada</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f4ecd8}
  #ar{position:fixed;inset:0}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;background:radial-gradient(circle at 50% 35%,#2a2148,#0b0910)}
  .ov h1{margin:0 0 8px;color:#E7C815;font-size:2rem}
  .ov p{margin:0 0 22px;opacity:.85;max-width:320px;line-height:1.4}
  .btn{border:0;border-radius:16px;padding:16px 26px;font-size:1.05rem;font-weight:800;background:#E7C815;color:#111;cursor:pointer}
  #hint{position:fixed;left:0;right:0;bottom:22px;text-align:center;z-index:5;font-weight:700;text-shadow:0 2px 8px #000;transition:opacity .4s}
  #hint.off{opacity:0}
  #err{color:#ff8a7a;margin-top:14px;font-size:.9rem;max-width:320px}
  .mindar-ui-overlay{display:none!important}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/",
  "mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
}}
</script>
</head>
<body>
<div id="ar"></div>
<div class="ov" id="start">
  <h1>YemeroFoni</h1>
  <p id="intro">Apunta la cámara a tu sticker y súbele el volumen.</p>
  <button class="btn" id="go">▶ Activar luna</button>
  <div id="err"></div>
</div>
<div id="hint" class="off">Apunta al sticker completo 🌙</div>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';

const P = new URLSearchParams(location.search);
const K = (P.get('s') || 'N').toUpperCase().replace(/[^NOGM]/g,'') || 'N';
const THEMES = {
  N:{name:'Noche',   track:'Reyes del After', fx:'estrellas', c1:'#D4E2D5', c2:'#8BD450', c3:'#F3E08A'},
  O:{name:'Original',track:'DARK',            fx:'constelacion', c1:'#E7C815', c2:'#18A162', c3:'#D6365D'},
  G:{name:'Gulf',    track:'RYTHM',           fx:'velocidad', c1:'#F27321', c2:'#8DC6E8', c3:'#FFFFFF'},
  M:{name:'Monarca', track:'Algo Leve',       fx:'mariposas', c1:'#E8761E', c2:'#151311', c3:'#FBF4E4'},
};
const T = THEMES[K];
document.getElementById('intro').textContent = `Luna ${T.name} · suena "${T.track}". Apunta la cámara a tu sticker y súbele el volumen.`;

/* ---------- utilidades de textura ---------- */
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}
const dotTex = (col)=>canvasTex(64,64,(g,w,h)=>{const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,col);r.addColorStop(.35,col);r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,w,h);});
const starTex = (col)=>canvasTex(64,64,(g)=>{g.translate(32,32);g.fillStyle=col;g.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?11:30;g.lineTo(Math.cos(a)*r,Math.sin(a)*r);}g.closePath();g.fill();});
const flyTex = (wing,edge,spot,open)=>canvasTex(128,128,(g)=>{g.translate(64,64);const s=open;
  for(const sx of [-1,1]){g.save();g.scale(sx*s,1);
    g.fillStyle=edge;g.beginPath();g.moveTo(4,-4);g.bezierCurveTo(30,-60,60,-40,58,-8);g.bezierCurveTo(50,4,20,4,4,2);g.fill();
    g.beginPath();g.moveTo(4,4);g.bezierCurveTo(40,10,44,40,22,46);g.bezierCurveTo(10,40,6,20,4,6);g.fill();
    g.fillStyle=wing;g.beginPath();g.moveTo(8,-6);g.bezierCurveTo(30,-50,52,-34,50,-10);g.bezierCurveTo(42,-2,22,0,8,0);g.fill();
    g.beginPath();g.moveTo(8,6);g.bezierCurveTo(34,12,36,34,22,38);g.bezierCurveTo(14,32,10,18,8,8);g.fill();
    g.fillStyle=spot;for(const [x,y] of [[50,-14],[44,-30],[28,40]]){g.beginPath();g.arc(x,y,3,0,7);g.fill();}
    g.restore();}
  g.fillStyle=edge;g.fillRect(-3,-22,6,48);});

/* ---------- audio reactivo ---------- */
let actx, analyser, freq, audioEl;
function setupAudio(){
  audioEl = new Audio(`${K}.mp3`); audioEl.loop = true; audioEl.crossOrigin='anonymous';
  actx = new (window.AudioContext||window.webkitAudioContext)();
  const src = actx.createMediaElementSource(audioEl);
  analyser = actx.createAnalyser(); analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.6;
  src.connect(analyser); analyser.connect(actx.destination);
  freq = new Uint8Array(analyser.frequencyBinCount);
}
let kick=0, kickAvg=0, energy=0, lastKick=0;
function readAudio(t){
  if(!analyser) return;
  analyser.getByteFrequencyData(freq);
  let lo=0; for(let i=1;i<6;i++) lo+=freq[i]; lo/=5*255;           // ~40–220 Hz
  let all=0; for(let i=0;i<freq.length;i++) all+=freq[i]; energy=all/(freq.length*255);
  kickAvg = kickAvg*0.95 + lo*0.05;
  if(lo > kickAvg*1.18 && lo>0.45 && t-lastKick>0.22){ kick=1; lastKick=t; onKick(); }
  kick *= 0.88;
}

/* ---------- escena AR ---------- */
const meta = await fetch('meta.json').then(r=>r.json()).then(m=>m[K]);
const mind = new MindARThree({ container: document.getElementById('ar'), imageTargetSrc: `${K}.mind`,
  uiLoading:'no', uiScanning:'no', uiError:'no', filterMinCF:0.0001, filterBeta:0.001 });
const { renderer, scene, camera } = mind;
renderer.outputEncoding = THREE.sRGBEncoding;
const anchor = mind.addAnchor(0);
const root = new THREE.Group(); anchor.group.add(root);
const ov=(o,n)=>{o.renderOrder=n;o.traverse(c=>{if(c.material){c.material.depthTest=false;c.material.depthWrite=false;}});return o;};
const loader = new THREE.TextureLoader();
const tex = (u)=>{const t=loader.load(u);t.encoding=THREE.sRGBEncoding;return t;};

// 1) fondo del sticker sin la luna (tapa la luna impresa para poder moverla)
const bg = new THREE.Mesh(new THREE.CircleGeometry(0.5,96), new THREE.MeshBasicMaterial({map:tex(`${K}_bg.png`),transparent:true}));
ov(bg,0); root.add(bg);
// halo que late con el bombo
const halo = new THREE.Mesh(new THREE.RingGeometry(0.5,0.56,96), new THREE.MeshBasicMaterial({color:T.c1,transparent:true,opacity:0}));
halo.position.z=0.001; ov(halo,1); root.add(halo);
// 2) la luna, separada y "flotando"
const moonPivot = new THREE.Group(); moonPivot.position.set(meta.cx, meta.cy - meta.h*0.30, 0.02); root.add(moonPivot);
const moonMesh = new THREE.Mesh(new THREE.PlaneGeometry(meta.w, meta.h), new THREE.MeshBasicMaterial({map:tex(`${K}_luna.png`),transparent:true}));
moonMesh.position.y = meta.h*0.30; moonPivot.add(moonMesh); ov(moonMesh,3);
const shadow = new THREE.Mesh(new THREE.CircleGeometry(meta.w*0.42,48), new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.25}));
shadow.visible=false;

// 3) humo saliendo del cigarro (punta aprox. en el 66% x, 52% y de la capa luna)
const smokeTex = dotTex('rgba(255,255,255,0.9)'); const smokes=[];
function puff(){const m=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,transparent:true,opacity:0.7,depthWrite:false}));
  m.position.set(meta.cx+meta.w*0.20, meta.cy+meta.h*0.06, 0.03); m.scale.setScalar(0.03); m.userData={v:0.06+Math.random()*0.04,dx:(Math.random()-.4)*0.03,life:0};
  ov(m,4); root.add(m); smokes.push(m);}

// 4) efecto propio de cada sticker
const fx=[];
function spawn(){
  if(T.fx==='estrellas' || T.fx==='constelacion'){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:starTex(Math.random()<.5?T.c1:T.c3),transparent:true,depthWrite:false}));
    const a=Math.random()*Math.PI*2, r=0.35+Math.random()*0.5; s.position.set(Math.cos(a)*r, Math.sin(a)*r, 0.05+Math.random()*0.35);
    s.userData={life:0,max:2+Math.random()*2,base:0.03+Math.random()*0.04,tw:Math.random()*6}; ov(s,5); root.add(s); fx.push(s);
  } else if(T.fx==='velocidad'){
    const col=Math.random()<.6?T.c1:T.c2; const m=new THREE.Mesh(new THREE.PlaneGeometry(0.35+Math.random()*0.4,0.012+Math.random()*0.012),
      new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.9,depthWrite:false}));
    const side=Math.random()<.5?-1:1; m.position.set(side*1.4,(Math.random()-.5)*0.9,0.05+Math.random()*0.25);
    m.userData={life:0,max:0.6,v:-side*(2.6+Math.random()*1.5)}; ov(m,5); root.add(m); fx.push(m);
  } else if(T.fx==='mariposas'){
    const g=new THREE.Group(); const open=flyTex(T.c1,'#151311','#FBF4E4',1), shut=flyTex(T.c1,'#151311','#FBF4E4',0.35);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:open,transparent:true,depthWrite:false})); sp.scale.setScalar(0.09+Math.random()*0.05); g.add(sp);
    g.position.set((Math.random()-.5)*0.5,(Math.random()-.5)*0.5,0.03);
    g.userData={life:0,max:4+Math.random()*2,a:Math.random()*6.28,r:0.25+Math.random()*0.35,up:0.08+Math.random()*0.08,open,shut,sp,ph:Math.random()*6}; ov(g,5); root.add(g); fx.push(g);
  }
}
let constellation=null;
function onKick(){
  for(let i=0;i<(T.fx==='velocidad'?3:1);i++) spawn();
  if(Math.random()<0.5) puff();
}
// constelación (Original): líneas entre estrellas en momentos fuertes
function drawConstellation(){
  if(constellation){root.remove(constellation);}
  const pts=fx.filter(o=>o.isSprite).slice(-7).map(o=>o.position.clone()); if(pts.length<3) return;
  constellation=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:T.c1,transparent:true,opacity:0.8}));
  constellation.userData={life:0}; ov(constellation,5); root.add(constellation);
}

/* ---------- animación ---------- */
const clock = new THREE.Clock(); let found=false;
anchor.onTargetFound = ()=>{found=true; document.getElementById('hint').classList.add('off'); if(audioEl&&audioEl.paused) audioEl.play();};
anchor.onTargetLost  = ()=>{found=false; document.getElementById('hint').classList.remove('off'); if(audioEl) audioEl.pause();};
let ambient=0;
function loop(){
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  readAudio(t);
  // luna: flota, se mece y "late"
  moonPivot.position.z = 0.02 + 0.03*Math.sin(t*1.3) + kick*0.03;
  moonPivot.rotation.z = 0.06*Math.sin(t*2.1) + kick*0.05;
  moonMesh.scale.setScalar(1 + kick*0.06);
  halo.material.opacity = 0.15*energy + kick*0.55; halo.scale.setScalar(1+kick*0.06);
  // sin audio aún: genera algo de ambiente
  ambient+=dt; if(ambient>(analyser?0.9:0.5)){ambient=0; spawn(); if(Math.random()<.6) puff();}
  // humo
  for(let i=smokes.length-1;i>=0;i--){const m=smokes[i],u=m.userData;u.life+=dt;m.position.y+=u.v*dt;m.position.x+=u.dx*dt;m.position.z+=0.02*dt;
    m.scale.setScalar(0.03+u.life*0.06);m.material.opacity=Math.max(0,0.7-u.life*0.35);if(u.life>2){root.remove(m);smokes.splice(i,1);}}
  // efectos
  for(let i=fx.length-1;i>=0;i--){const o=fx[i],u=o.userData;u.life+=dt;
    if(T.fx==='estrellas'||T.fx==='constelacion'){const k=Math.sin(Math.min(1,u.life/u.max)*Math.PI);o.scale.setScalar(u.base*(0.6+0.6*k+kick*0.6)*(0.8+0.2*Math.sin(t*8+u.tw)));o.material.opacity=k;}
    else if(T.fx==='velocidad'){o.position.x+=u.v*dt;o.material.opacity=Math.max(0,1-u.life/u.max);}
    else if(T.fx==='mariposas'){u.a+=dt*0.9;o.position.x=Math.cos(u.a)*u.r*(1+u.life*0.15);o.position.y=Math.sin(u.a)*u.r*0.6+u.life*u.up;o.position.z=0.05+u.life*0.08;
      u.sp.material.map=(Math.sin(t*14+u.ph)>0)?u.open:u.shut;u.sp.material.opacity=Math.min(1,(u.max-u.life));}
    if(u.life>u.max){root.remove(o);fx.splice(i,1);}}
  if(T.fx==='constelacion'){ if(kick>0.95 && Math.random()<0.25) drawConstellation(); if(constellation){constellation.userData.life+=dt;constellation.material.opacity=Math.max(0,0.8-constellation.userData.life*0.4);} }
  renderer.render(scene,camera);
}

document.getElementById('go').addEventListener('click', async ()=>{
  const err=document.getElementById('err');
  try{
    setupAudio(); await actx.resume();
    await mind.start();
    document.getElementById('start').style.display='none';
    document.getElementById('hint').classList.remove('off');
    renderer.setAnimationLoop(loop);
  }catch(e){ err.textContent='No se pudo abrir la cámara. Revisa los permisos del navegador e inténtalo de nuevo. ('+(e&&e.message||e)+')'; console.error(e); }
});
window.__arReady = true;
</script>
</body>
</html>
