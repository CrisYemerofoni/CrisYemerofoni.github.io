<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>YemeroFoni · Realidad aumentada</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f4ecd8}
  #ar{position:fixed;inset:0}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;background:radial-gradient(circle at 50% 35%,#2a2148,#0b0910)}
  .ov h1{margin:0 0 8px;color:#E7C815;font-size:2rem}
  .ov p{margin:0 0 22px;opacity:.85;max-width:320px;line-height:1.4}
  .btn{border:0;border-radius:16px;padding:16px 26px;font-size:1.05rem;font-weight:800;background:#E7C815;color:#111;cursor:pointer}
  #hint{position:fixed;left:0;right:0;bottom:22px;text-align:center;z-index:5;font-weight:700;text-shadow:0 2px 8px #000;transition:opacity .4s}
  #hint.off{opacity:0}
  #err{color:#ff8a7a;margin-top:14px;font-size:.9rem;max-width:320px}
  .mindar-ui-overlay{display:none!important}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/",
  "mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
}}
</script>
</head>
<body>
<div id="ar"></div>
<div class="ov" id="start">
  <h1>YemeroFoni</h1>
  <p id="intro">Apunta la cámara a tu sticker y súbele el volumen.</p>
  <button class="btn" id="go">▶ Despertar a la luna</button>
  <div id="err"></div>
</div>
<div id="hint" class="off">Apunta al sticker completo 🌙</div>

<script type="module">
import * as THREE from 'three';

const P = new URLSearchParams(location.search);
const K = (P.get('s') || 'N').toUpperCase().replace(/[^NOGM]/g,'') || 'N';
const DEMO = P.has('demo');
const THEMES = {
  N:{name:'Noche',   track:'Reyes del After', fx:'estrellas',    c1:'#D4E2D5', c2:'#8BD450', c3:'#F3E08A', smoke:'#F7F7F2'},
  O:{name:'Original',track:'DARK',            fx:'constelacion', c1:'#E7C815', c2:'#18A162', c3:'#D6365D', smoke:'#EDEDED'},
  G:{name:'Racing',  track:'RYTHM',           fx:'velocidad',    c1:'#F27321', c2:'#8DC6E8', c3:'#FFFFFF', smoke:'#FFFFFF'},
  M:{name:'Monarca', track:'Algo Leve',       fx:'mariposas',    c1:'#E8761E', c2:'#151311', c3:'#FBF4E4', smoke:'#FBF4E4'},
};
const T = THEMES[K];
document.getElementById('intro').textContent = `Luna ${T.name} · suena "${T.track}". Apunta la cámara a tu sticker y súbele el volumen.`;

/* azar con semilla (el modo demo es repetible) */
let seed = 7; const rnd = DEMO ? ()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;} : Math.random;

/* ---------- texturas dibujadas ---------- */
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}
const softTex = (col)=>canvasTex(128,128,(g,w,h)=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,col);r.addColorStop(.45,col);r.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=.9;g.fillStyle=r;g.fillRect(0,0,w,h);});
const glowTex = canvasTex(128,128,(g)=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,240,200,1)');r.addColorStop(.18,'rgba(255,150,60,.9)');r.addColorStop(.5,'rgba(255,80,30,.25)');r.addColorStop(1,'rgba(255,60,20,0)');g.fillStyle=r;g.fillRect(0,0,128,128);});
const shadowTex = canvasTex(128,128,(g)=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(0,0,0,.75)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,128,128);});
const ringTex = (col)=>canvasTex(256,256,(g)=>{g.strokeStyle=col;g.lineWidth=26;g.globalAlpha=.85;g.filter='blur(6px)';g.beginPath();g.arc(128,128,90,0,7);g.stroke();});
const starTex = (col)=>canvasTex(64,64,(g)=>{g.translate(32,32);g.fillStyle=col;g.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?11:30;g.lineTo(Math.cos(a)*r,Math.sin(a)*r);}g.closePath();g.fill();});
const flyTex = (wing,edge,spot,open)=>canvasTex(128,128,(g)=>{g.translate(64,64);const s=open;
  for(const sx of [-1,1]){g.save();g.scale(sx*s,1);
    g.fillStyle=edge;g.beginPath();g.moveTo(4,-4);g.bezierCurveTo(30,-60,60,-40,58,-8);g.bezierCurveTo(50,4,20,4,4,2);g.fill();
    g.beginPath();g.moveTo(4,4);g.bezierCurveTo(40,10,44,40,22,46);g.bezierCurveTo(10,40,6,20,4,6);g.fill();
    g.fillStyle=wing;g.beginPath();g.moveTo(8,-6);g.bezierCurveTo(30,-50,52,-34,50,-10);g.bezierCurveTo(42,-2,22,0,8,0);g.fill();
    g.beginPath();g.moveTo(8,6);g.bezierCurveTo(34,12,36,34,22,38);g.bezierCurveTo(14,32,10,18,8,8);g.fill();
    g.fillStyle=spot;for(const [x,y] of [[50,-14],[44,-30],[28,40]]){g.beginPath();g.arc(x,y,3,0,7);g.fill();}
    g.restore();}
  g.fillStyle=edge;g.fillRect(-3,-22,6,48);});

/* ---------- audio reactivo ---------- */
let actx, analyser, freq, audioEl;
function setupAudio(){
  audioEl = new Audio(`${K}.mp3`); audioEl.loop = true; audioEl.crossOrigin='anonymous';
  actx = new (window.AudioContext||window.webkitAudioContext)();
  const src = actx.createMediaElementSource(audioEl);
  analyser = actx.createAnalyser(); analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.6;
  src.connect(analyser); analyser.connect(actx.destination);
  freq = new Uint8Array(analyser.frequencyBinCount);
}
let kick=0, kickAvg=0, energy=0, lastKick=-9, kicks=0;
function readAudio(t){
  if(DEMO){ const b=Math.floor(t*2.08); if(b>kicks){kicks=b; kick=1; lastKick=t; onKick(t);} energy=.35; kick*=.86; return; } // 125 BPM simulado
  if(!analyser) return;
  analyser.getByteFrequencyData(freq);
  let lo=0; for(let i=1;i<6;i++) lo+=freq[i]; lo/=5*255;
  let all=0; for(let i=0;i<freq.length;i++) all+=freq[i]; energy=all/(freq.length*255);
  kickAvg = kickAvg*0.95 + lo*0.05;
  if(lo > kickAvg*1.18 && lo>0.45 && t-lastKick>0.22){ kick=1; lastKick=t; kicks++; onKick(t); }
  kick *= 0.88;
}

/* ---------- escena ---------- */
const meta = await fetch('meta.json').then(r=>r.json()).then(m=>m[K]);
const C = meta.capas;
let renderer, scene, camera, mind=null, anchorGroup;
if(DEMO){
  renderer = new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight); document.getElementById('ar').appendChild(renderer.domElement);
  scene = new THREE.Scene(); scene.background = new THREE.Color('#8a6a4d');
  camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.01, 20);
  const ang = parseFloat(P.get('ang')||'38')*Math.PI/180, dist=1.75;
  camera.position.set(0.0, -Math.sin(ang)*dist, Math.cos(ang)*dist); camera.lookAt(0,0.02,0.1);
  anchorGroup = new THREE.Group(); scene.add(anchorGroup);
} else {
  const { MindARThree } = await import('mindar-image-three');
  mind = new MindARThree({ container: document.getElementById('ar'), imageTargetSrc: `${K}.mind`,
    uiLoading:'no', uiScanning:'no', uiError:'no', filterMinCF:0.0001, filterBeta:0.001 });
  ({ renderer, scene, camera } = mind);
  const anchor = mind.addAnchor(0); anchorGroup = anchor.group;
  anchor.onTargetFound = ()=>{found=true; foundAt=clockT; document.getElementById('hint').classList.add('off'); if(audioEl&&audioEl.paused) audioEl.play();};
  anchor.onTargetLost  = ()=>{found=false; document.getElementById('hint').classList.remove('off'); if(audioEl) audioEl.pause();};
}
renderer.outputEncoding = THREE.sRGBEncoding;
const root = new THREE.Group(); anchorGroup.add(root);
const ord=(o,n)=>{o.renderOrder=n;o.traverse(c=>{if(c.material){c.material.depthTest=false;c.material.depthWrite=false;}});return o;};
const loader = new THREE.TextureLoader();
const tex = (u)=>{const t=loader.load(u);t.encoding=THREE.sRGBEncoding;return t;};
const atlas = tex(`${K}_capas.png`);
// convierte una capa del atlas en un plano (coordenadas: unidades del sticker, ancho = 1)
function layer(n){
  const r=C[n], g=new THREE.PlaneGeometry(r.w*meta.w, r.h*meta.h), uv=g.attributes.uv;
  for(let i=0;i<uv.count;i++){uv.setXY(i, uv.getX(i)?r.u1:r.u0, uv.getY(i)?r.v1:r.v0);}
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:atlas,transparent:true}));
  m.userData.home=new THREE.Vector2(meta.cx + r.x*meta.w, meta.cy + r.y*meta.h); return m;
}
const L2S=(x,y)=>new THREE.Vector2(meta.cx+(x-0.5)*meta.w, meta.cy+(0.5-y)*meta.h); // punto de la capa luna (0..1, y hacia abajo) -> sticker

// 1) fondo impreso sin luna ni texto + el texto "YemeroFoni" que se queda pegado al sticker
const bg = new THREE.Mesh(new THREE.CircleGeometry(0.5,96), new THREE.MeshBasicMaterial({map:tex(`${K}_bg.png`),transparent:true}));
ord(bg,0); root.add(bg);
const text = layer('text'); text.position.set(text.userData.home.x,text.userData.home.y,0.001); ord(text,2); root.add(text);
// halo del borde y ondas
const halo = new THREE.Mesh(new THREE.RingGeometry(0.5,0.56,96), new THREE.MeshBasicMaterial({color:T.c1,transparent:true,opacity:0}));
halo.position.z=0.001; ord(halo,1); root.add(halo);
// sombra que deja la luna al despegarse
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(meta.w*0.9, meta.h*0.75), new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,opacity:0}));
shadow.position.set(meta.cx-0.02, meta.cy+0.02, 0.002); ord(shadow,1); root.add(shadow);

// 2) la luna: se despega del sticker y queda flotando en 3D
const bodyBottom = C.body.y*meta.h + meta.cy - C.body.h*meta.h/2;
const rig = new THREE.Group(); rig.position.set(meta.cx, bodyBottom, 0); root.add(rig);   // bisagra en la punta de abajo
const moon = new THREE.Group(); rig.add(moon);
const at=(m,z,ro)=>{m.position.set(m.userData.home.x-rig.position.x, m.userData.home.y-rig.position.y, z); ord(m,ro); moon.add(m); return m;};
const body = at(layer('body'),0.000,10);
const cig  = at(layer('cig'), 0.012,12);
const wisp = at(layer('smoke'),0.030,13);
const star = at(layer('star'),0.040,14);
// párpado: se dibuja con el color del cuerpo y una línea de pestaña
const E=meta.ojo, lidW=(E.x1-E.x0)*meta.w, lidH=(E.y1-E.y0)*meta.h;
const lidTex = canvasTex(256,140,(g,w,h)=>{g.fillStyle=meta.cuerpo;g.beginPath();g.ellipse(w/2,h*0.48,w*0.47,h*0.44,0,0,7);g.fill();
  g.strokeStyle='#121014';g.lineWidth=13;g.lineCap='round';g.beginPath();g.moveTo(w*0.05,h*0.5);g.quadraticCurveTo(w*0.5,h*0.98,w*0.95,h*0.48);g.stroke();});
const lid = new THREE.Mesh(new THREE.PlaneGeometry(lidW,lidH), new THREE.MeshBasicMaterial({map:lidTex,transparent:true}));
{const c=L2S((E.x0+E.x1)/2,(E.y0+E.y1)/2); lid.position.set(c.x-rig.position.x,c.y-rig.position.y,0.004);} ord(lid,11); lid.visible=false; moon.add(lid);
// brasa del cigarro (punta de arriba a la derecha)
const tip = L2S(C.cig.x+0.5+C.cig.w*0.40, 0.5-C.cig.y-C.cig.h*0.40);
const ember = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
ember.position.set(tip.x-rig.position.x, tip.y-rig.position.y, 0.02); ember.scale.setScalar(0.05); ord(ember,15); moon.add(ember);
const mouth = L2S(0.56,0.57);
const tearAt = L2S(C.tear.x+0.5, 0.5-C.tear.y);

/* ---------- partículas ---------- */
const parts=[];
function addPart(o,ro,u){ord(o,ro);o.userData=Object.assign({life:0},u);root.add(o);parts.push(o);return o;}
const smokeT = softTex(T.smoke), ringT = ringTex(T.smoke), rippleT = ringTex(T.c1);
const worldOf=(obj)=>{const v=new THREE.Vector3();obj.getWorldPosition(v);return root.worldToLocal(v);};
function puff(big){ const p=worldOf(ember);
  addPart(new THREE.Sprite(new THREE.SpriteMaterial({map:smokeT,transparent:true,opacity:.75,depthWrite:false})),20,
    {kind:'puff',max:big?3:2.2,p0:p.clone(),vx:(rnd()-.3)*0.03,vy:0.07+rnd()*0.05,vz:0.05+rnd()*0.05,s0:big?0.05:0.03}); }
function smokeRing(){ const m=new THREE.Vector3(mouth.x,mouth.y,0); const o=moon.localToWorld(new THREE.Vector3(mouth.x-rig.position.x,mouth.y-rig.position.y,0.02)); root.worldToLocal(o);
  addPart(new THREE.Sprite(new THREE.SpriteMaterial({map:ringT,transparent:true,opacity:.9,depthWrite:false})),21,{kind:'ring',max:2.4,p0:o.clone()}); }
function tearDrop(){ const o=moon.localToWorld(new THREE.Vector3(tearAt.x-rig.position.x,tearAt.y-rig.position.y,0.01)); root.worldToLocal(o);
  const tr=C.tear; const m=layer('tear'); m.position.copy(o);
  addPart(m,22,{kind:'tear',max:3,p0:o.clone(),vz:0}); }
function ripple(x,y){ addPart(new THREE.Mesh(new THREE.PlaneGeometry(0.1,0.1),new THREE.MeshBasicMaterial({map:rippleT,transparent:true,opacity:1})),3,{kind:'ripple',max:1.4,p0:new THREE.Vector3(x,y,0.003)}); }

// efecto propio de cada sticker (se conserva)
function spawnFx(){
  if(T.fx==='estrellas' || T.fx==='constelacion'){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:starTex(rnd()<.5?T.c1:T.c3),transparent:true,depthWrite:false}));
    const a=rnd()*Math.PI*2, r=0.35+rnd()*0.5; s.position.set(Math.cos(a)*r, Math.sin(a)*r, 0.05+rnd()*0.35);
    addPart(s,5,{kind:'star',max:2+rnd()*2,base:0.03+rnd()*0.04,tw:rnd()*6});
  } else if(T.fx==='velocidad'){
    const col=rnd()<.6?T.c1:T.c2; const m=new THREE.Mesh(new THREE.PlaneGeometry(0.35+rnd()*0.4,0.012+rnd()*0.012),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.9}));
    const side=rnd()<.5?-1:1; m.position.set(side*1.4,(rnd()-.5)*0.9,0.05+rnd()*0.25); addPart(m,5,{kind:'speed',max:0.6,v:-side*(2.6+rnd()*1.5)});
  } else if(T.fx==='mariposas'){
    const open=flyTex(T.c1,'#151311','#FBF4E4',1), shut=flyTex(T.c1,'#151311','#FBF4E4',0.35);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:open,transparent:true,depthWrite:false})); sp.scale.setScalar(0.09+rnd()*0.05);
    sp.position.set((rnd()-.5)*0.5,(rnd()-.5)*0.5,0.03); addPart(sp,5,{kind:'fly',max:4+rnd()*2,a:rnd()*6.28,r:0.25+rnd()*0.35,up:0.08+rnd()*0.08,open,shut,ph:rnd()*6});
  }
}


// estrellas que pasan y katakana flotando (como en el visual de Algo Leve)
const KANA=['イ','ェ','メ','ロ','フ','ォ','ニ'], KCOL=[T.c1,T.c2,T.c3].filter(c=>c!=='#151311'), kanaCache={}, starCache={};
const JPF='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",sans-serif';
function kanaTex(ch,col){const k=ch+col; if(kanaCache[k]) return kanaCache[k]; const W=ch.length>1?768:128;
  return kanaCache[k]=canvasTex(W,128,(g,w,h)=>{g.font=`900 ${ch.length>1?86:96}px ${JPF}`;g.textAlign='center';g.textBaseline='middle';
    g.lineJoin='round';g.lineWidth=14;g.strokeStyle='#121014';g.strokeText(ch,w/2,h/2+4);g.fillStyle=col;g.fillText(ch,w/2,h/2+4);});}
const sTex=(col)=>starCache[col]||(starCache[col]=starTex(col));
function streamStar(){ const a=rnd()*Math.PI*2, r=0.05+rnd()*0.45, col=[T.c1,T.c3,'#F3E08A','#FFFFFF'][Math.floor(rnd()*4)];
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:sTex(col),transparent:true,depthWrite:false}));
  s.position.set(Math.cos(a)*r,Math.sin(a)*r,0.02);
  addPart(s,6,{kind:'stream',max:1.2+rnd()*0.9,dir:new THREE.Vector3(Math.cos(a)*(0.25+rnd()*0.5),Math.sin(a)*(0.25+rnd()*0.5),0.6+rnd()*0.7),base:0.012+rnd()*0.02,tw:rnd()*6}); }
function kana(word){ const ch=word?'イェメロフォニ':KANA[Math.floor(rnd()*KANA.length)], col=KCOL[Math.floor(rnd()*KCOL.length)];
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:kanaTex(ch,col),transparent:true,depthWrite:false}));
  const side=rnd()<.5?-1:1;
  if(word){ const tx=text.userData.home; s.position.set(tx.x,tx.y,0.01); addPart(s,16,{kind:'kana',max:3.2,w:0.66,h:0.11,vx:0,vy:-0.02,vz:0.16,rot:0}); }
  else { s.position.set(side*(0.3+rnd()*0.25),(rnd()-.5)*0.7,0.04+rnd()*0.1); const z=0.07+rnd()*0.06;
    addPart(s,7,{kind:'kana',max:2.2+rnd()*1.2,w:z,h:z,vx:side*0.03,vy:0.06+rnd()*0.06,vz:0.08+rnd()*0.08,rot:(rnd()-.5)*0.6}); } }

/* ---------- coreografía ---------- */
const EVS=[]; const EV=(n,t)=>{ if(DEMO) EVS.push([n,+t.toFixed(2)]); }; window.__ev=EVS;
let dbl=false, found=DEMO, foundAt=0, clockT=0, nextBlink=2.2, blinkUntil=-1, nextTear=4.5, nextRing=3.2, spin=-1;
function onKick(t){
  if(t-foundAt<1.2) return;
  if(rnd()<0.7) puff(false);
  for(let i=0;i<5;i++) streamStar(); if(rnd()<0.45) kana(false); if(kicks%32===16) kana(true);
  spawnFx(); if(T.fx==='velocidad'){spawnFx();spawnFx();}
  if(kicks%16===0){ smokeRing(); EV('ring',t); }
  if(kicks%32===0 && kicks>0) {spin=t; EV('spin',t);}           // cada 32 golpes: la luna da una vuelta
}
const ease=(x)=>{x=Math.min(1,Math.max(0,x));const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
function step(dt){
  clockT+=dt; const t=clockT; readAudio(t);
  const w = found ? t-foundAt : 0;
  const up = ease(w/1.4);                                   // despegue 0 → 1
  // luna: se levanta, se inclina hacia ti, flota y respira con el bombo
  rig.position.z = 0.17*up + 0.018*Math.sin(t*1.6)*up + kick*0.02*up;
  rig.rotation.x = 0.42*up;
  rig.rotation.z = 0.05*Math.sin(t*1.1)*up;
  let sp=0; if(spin>0){const k=(t-spin)/1.1; if(k<1) sp=ease(k)*Math.PI*2; else spin=-1;}
  {const cx=meta.cx-rig.position.x, cy=meta.cy-rig.position.y, c=Math.cos(sp), s=Math.sin(sp); moon.rotation.z=sp; moon.position.set(cx-(cx*c-cy*s), cy-(cx*s+cy*c), 0);}
  body.scale.set(1+kick*0.035, 1-kick*0.03, 1);
  shadow.material.opacity = 0.55*up; shadow.scale.setScalar(1+0.25*up+kick*0.05);
  halo.material.opacity = (0.12*energy + kick*0.45)*up;
  // humo dibujado: se estira y se mece
  wisp.position.z = 0.03+0.05*up; wisp.rotation.z = 0.12*Math.sin(t*2.3); wisp.scale.y = 1+0.12*Math.sin(t*1.7)+kick*0.15;
  // estrella: orbita alrededor de la luna
  const sa=t*0.9; star.position.set(star.userData.home.x-rig.position.x + Math.cos(sa)*0.06*up, star.userData.home.y-rig.position.y + Math.sin(sa)*0.04*up, 0.04+0.08*up*(0.5+0.5*Math.sin(sa)));
  star.rotation.z = t*1.2*up;
  // brasa
  ember.material.opacity = 0.35+0.65*kick; ember.scale.setScalar(0.045+0.05*kick);
  // parpadeo
  if(t>nextBlink){ blinkUntil=t+0.13; EV('blink',t); nextBlink=t+2.5+rnd()*3.5; if(!dbl && rnd()<0.3){ nextBlink=t+0.32; dbl=true; } else dbl=false; }
  lid.visible = t<blinkUntil && up>0.5;
  // lágrima que cae y salpica el sticker
  if(found && w>2 && t>nextTear){ tearDrop(); EV('tear',t); nextTear=t+7+rnd()*4; }
  if(found && w>2 && t>nextRing && !analyser){ smokeRing(); EV('ring',t); nextRing=t+6+rnd()*3; }
  if(found && w>1.2){ if(rnd()<dt*14) streamStar(); if(rnd()<dt*0.9) kana(false); }
  // sin bombo detectado: mantiene vida
  if(t-lastKick>1.6 && rnd()<dt*1.2){ spawnFx(); if(rnd()<.6) puff(false); }
  // partículas
  for(let i=parts.length-1;i>=0;i--){const o=parts[i],u=o.userData;u.life+=dt;const f=u.life/u.max;
    if(u.kind==='puff'){o.position.set(u.p0.x+u.vx*u.life,u.p0.y+u.vy*u.life,u.p0.z+u.vz*u.life);o.scale.setScalar(u.s0+u.life*0.07);o.material.opacity=Math.max(0,0.75*(1-f));}
    else if(u.kind==='ring'){o.position.set(u.p0.x+0.03*u.life,u.p0.y+0.05*u.life,u.p0.z+0.22*u.life);o.scale.setScalar(0.05+u.life*0.16);o.material.opacity=Math.max(0,0.9*(1-f));}
    else if(u.kind==='tear'){u.vz-=0.9*dt;o.position.z=Math.max(0.004,u.p0.z+0.0+u.vz*u.life*0.5);o.position.y=u.p0.y-0.05*u.life;
      if(o.position.z<=0.004 && !u.hit){u.hit=true;EV('splash',t);ripple(o.position.x,o.position.y);halo.material.opacity=0.8;u.max=u.life+0.15;} o.material.opacity=u.hit?0:1;}
    else if(u.kind==='ripple'){o.position.copy(u.p0);o.scale.setScalar(0.3+f*7);o.material.opacity=Math.max(0,1-f);}
    else if(u.kind==='star'){const k=Math.sin(Math.min(1,f)*Math.PI);o.scale.setScalar(u.base*(0.6+0.6*k+kick*0.6)*(0.8+0.2*Math.sin(t*8+u.tw)));o.material.opacity=k;}
    else if(u.kind==='stream'){o.position.addScaledVector(u.dir,dt);const k=Math.sin(Math.min(1,f)*Math.PI);o.scale.setScalar(u.base*(1+u.life*2.2)*(0.8+0.3*Math.sin(t*10+u.tw)));o.material.opacity=k;}
    else if(u.kind==='kana'){o.position.x+=u.vx*dt;o.position.y+=u.vy*dt;o.position.z+=u.vz*dt;o.material.rotation+=u.rot*dt;o.scale.set(u.w,u.h,1);o.material.opacity=Math.min(1,u.life*3,(u.max-u.life)*1.5);}
    else if(u.kind==='speed'){o.position.x+=u.v*dt;o.material.opacity=Math.max(0,1-f);}
    else if(u.kind==='fly'){u.a+=dt*0.9;o.position.set(Math.cos(u.a)*u.r*(1+u.life*0.15),Math.sin(u.a)*u.r*0.6+u.life*u.up,0.05+u.life*0.08);
      o.material.map=(Math.sin(t*14+u.ph)>0)?u.open:u.shut;o.material.opacity=Math.min(1,u.max-u.life);}
    if(u.life>u.max){root.remove(o);parts.splice(i,1);}}
}
// tocar la luna: guiño y aro de humo grande
renderer.domElement.addEventListener('pointerdown',(e)=>{
  const r=renderer.domElement.getBoundingClientRect(), v=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  const rc=new THREE.Raycaster(); rc.setFromCamera(v,camera);
  if(rc.intersectObject(body,false).length){ blinkUntil=clockT+0.35; smokeRing(); puff(true); for(let i=0;i<4;i++) spawnFx(); }
});

let last=performance.now();
function loop(){ const now=performance.now(), dt=Math.min((now-last)/1000,0.05); last=now; step(dt); renderer.render(scene,camera); }
if(DEMO){
  document.getElementById('start').style.display='none';
  window.__setT=(t)=>{ while(clockT<t) step(1/60); renderer.render(scene,camera); return parts.length; };
  if(!P.has('still')) renderer.setAnimationLoop(loop); else renderer.render(scene,camera);
} else {
  document.getElementById('go').addEventListener('click', async ()=>{
    const err=document.getElementById('err');
    try{
      setupAudio(); await actx.resume();
      await mind.start();
      document.getElementById('start').style.display='none';
      document.getElementById('hint').classList.remove('off');
      renderer.setAnimationLoop(loop);
    }catch(e){ err.textContent='No se pudo abrir la cámara. Revisa los permisos del navegador e inténtalo de nuevo. ('+(e&&e.message||e)+')'; console.error(e); }
  });
}
window.__arReady = true;
</script>
